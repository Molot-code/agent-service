[package]
name = "agent-windows"
version = "0.1.0"
edition = "2021"

# Описываем три отдельные программы, которые будут собраны

[[bin]]
name = "ParentalControlSvc"
path = "src/bin/service.rs"

[[bin]]
name = "agent-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "agent-tray"
path = "src/bin/tray.rs"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-service = "0.8.1"
axum = { version = "0.8.9", features = ["tokio"] }
chrono = "0.4.45"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.1", features = ["v4"] }
whoami = "2.1.3"
tower-http = { version = "0.7.1", features = ["fs"] }
toml = "1.2.1"
windows_users = "0.4.2"
thiserror = "2.0.21"
hostname = "0.4.2"
minijinja = "3.1.0"
tray-icon = "0.26.1"
tao = "0.37.2"
image = { version = "0.25.10", features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
windows_firewall = "0.8.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",    
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",    
    "Win32_System_Com",
    "Win32_System_Environment",  
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",    
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_TaskScheduler",    
    "Win32_System_Threading",
    "Win32_System_Variant",    
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell"
] }

