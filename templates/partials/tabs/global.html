{# partials/tabs/global.html #}
{% macro global_settings() %}
<div x-show="tab === 'global'" class="space-y-4" x-transition>
    <template x-for="cat in groupedSettings()" :key="cat.name">
        <div class="bg-white p-3 sm:p-4 md:p-6 rounded-lg shadow border-l-4"
             :class="{
                 'border-l-gray-400': cat.name === 'general',
                 'border-l-yellow-500': cat.name === 'notifications',
                 'border-l-red-500': cat.name === 'security',
                 'border-l-blue-500': cat.name === 'timing',
             }">

            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base sm:text-lg md:text-xl font-bold text-gray-800"
                    x-text="cat.title"></h2>
            </div>

            <div class="space-y-5">
                <template x-for="s in cat.items" :key="s.key">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2"
                            x-text="s.label"></label>

                        {# ---------- STRING ---------- #}
                        <template x-if="s.value_type === 'string'">
                            <input type="text" x-model="s.value"
                                @change="saveSetting(s)"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                                        focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                                        transition">
                        </template>

                        {# ---------- INT ---------- #}
                        <template x-if="s.value_type === 'int'">
                            <input type="number" x-model="s.value"
                                @change="saveSetting(s)"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                                        focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                                        transition">
                        </template>

                        {# ---------- PASSWORD ---------- #}
                        <template x-if="s.value_type === 'password'">
                            <input type="password" x-model="s.value"
                                @change="saveSetting(s)"
                                placeholder="Оставьте пустым, чтобы не менять"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                                        focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                                        transition">
                        </template>

                        {# ---------- MULTILINE ---------- #}
                        <template x-if="s.value_type === 'multiline'">
                            <textarea x-model="s.value" rows="4"
                                    @blur="saveSetting(s)"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                                            focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                                            transition resize-y"></textarea>
                        </template>

                        {# ---------- BOOL ---------- #}
                        <template x-if="s.value_type === 'bool'">
                            <label class="inline-flex items-center cursor-pointer">
                                <input type="checkbox"
                                    :checked="s.value === 'true'"
                                    @change="s.value = $event.target.checked ? 'true' : 'false'; saveSetting(s)"
                                    class="w-5 h-5 rounded border-gray-300 text-blue-600
                                            focus:ring-2 focus:ring-blue-500 cursor-pointer">
                                <span class="ml-2 text-sm text-gray-600">
                                    <span x-show="s.value === 'true'">Включено</span>
                                    <span x-show="s.value !== 'true'">Выключено</span>
                                </span>
                            </label>
                        </template>

                        {# ---------- ENUM ---------- #}
                        <template x-if="s.value_type === 'enum'">
                            <select x-model="s.value"
                                    @change="saveSetting(s)"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm
                                        focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                                        transition bg-white">
                                <template x-for="opt in enumOptions(s.key)" :key="opt.value">
                                    <option :value="opt.value" x-text="opt.label"></option>
                                </template>
                            </select>
                        </template>

                        <p x-show="s.description"
                           class="text-xs text-gray-500 mt-1.5 leading-relaxed"
                           x-text="s.description"></p>

                        {# Лёгкий индикатор "сохранено" рядом с полем #}
                        <p x-show="s.__saving" class="text-xs text-gray-400 mt-1">⏳ Сохранение…</p>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
{% endmacro %}
