<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Родительский контроль{% endblock %}</title>
    <!-- 1. Плагин Collapse (ОБЯЗАТЕЛЬНО ДО ядра Alpine) -->
    <script defer src="cdn-collapse.min.js"></script>    
    <script defer src="cdn.min.js"></script>
    <link href="tailwind.css" rel="stylesheet">
    <script src="app.min.js"></script>

    <!-- Скрипт для принудительного сброса кэша и Service Worker внутри Tauri -->
    <script>
        (function() {
            // Проверяем, что приложение запущено внутри Tauri
            if (window.__TAURI_INTERNALS__ || window.__TAURI__) {
                console.log("удаляем кэш");
                // 1. Удаляем Service Worker, если он успел зарегистрироваться
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for (let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                // 2. Очищаем Cache Storage самого WebView
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        for (let name of names) {
                            caches.delete(name);
                        }
                    });
                }
            }
        })();
    </script>

    <style>
        button, a { touch-action: manipulation; }
        .pin-input { letter-spacing: 0.5em; text-align: center; font-size: 1.5rem; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-sm sm:text-base" x-data="app" x-cloak>
    {% block content %}{% endblock %}
</body>
</html>
