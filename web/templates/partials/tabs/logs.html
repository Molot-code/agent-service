{% macro logs() %}
<div x-show="tab === 'logs'" class="space-y-4" x-transition>
    <div class="flex gap-2 flex-wrap items-center">
        <select x-model="logsDate" @change="loadLogs()" class="p-2 border rounded text-sm bg-white">
            <template x-for="d in logsDates" :key="d">
                <option :value="d" x-text="d"></option>
            </template>
            <option x-show="logsDates.length === 0" value="">Нет дат</option>
        </select>

        <select x-model="logsSource" @change="loadLogs()" class="p-2 border rounded text-sm bg-white">
            <option value="service">Служба</option>
            <option value="agent_cli">CLI</option>
            <option value="agent_tray">Трей</option>
            <option value="debug">Debug</option>
            <option value="error">Error</option>
        </select>

        <select x-model="logsLevel" @change="loadLogs()" class="p-2 border rounded text-sm bg-white">
            <option value="info">Info+</option>
            <option value="warn">Warn+</option>
            <option value="error">Error</option>
            <option value="debug">Debug (всё)</option>
        </select>

        <button @click="loadLogs()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm transition-colors">
            Обновить
        </button>
    </div>

    <pre class="bg-gray-900 text-green-400 text-xs p-4 rounded overflow-auto max-h-[60vh] min-h-[200px]"
        x-text="logsContent || 'Загрузка...'"></pre>
</div>
{% endmacro %}
