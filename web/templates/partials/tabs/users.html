{# partials/tabs/users.html #}
{% macro users() %}
<div x-show="tab === 'users'" class="space-y-4" x-transition>

    {# Карточка выбора пользователя #}
    <div class="bg-white p-3 sm:p-4 md:p-6 rounded-lg shadow border-l-4 border-l-blue-500">
        <div class="flex items-center justify-between mb-3">
            <label class="block text-sm font-medium">👤 Пользователь:</label>

            <div class="flex items-center gap-3">
                <button @click="loadUserData()" :disabled="loadingUserData"
                    class="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1 disabled:opacity-50"
                    title="Обновить данные пользователя">
                    <span x-show="!loadingUserData">🔄 Обновить</span>
                    <span x-show="loadingUserData">⏳ Загрузка...</span>
                </button>

                <label class="inline-flex items-center cursor-pointer"
                    x-show="selectedUser && users.find(u => u.sid === selectedUser)?.is_control_enabled">
                    <input type="checkbox" class="sr-only peer"
                        :checked="users.find(u => u.sid === selectedUser)?.is_control_enabled"
                        @change="toggleControl(selectedUser, $event.target.checked)">
                    <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    <span class="ms-2 text-sm font-medium text-blue-600">Включен</span>
                </label>
            </div>
        </div>

        <select x-model="selectedUser" @change="loadUserData()" class="w-full p-3 border rounded">
            <option value="" disabled>Выберите пользователя...</option>
            <template x-for="user in users" :key="user.sid">
                <option :value="user.sid" x-text="user.username"></option>
            </template>
        </select>

        <div x-show="selectedUser && !users.find(u => u.sid === selectedUser)?.is_control_enabled" class="mt-4">
            <button @click="enableControlForSelectedUser()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-lg font-semibold shadow transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Включить контроль
            </button>
        </div>

        <div x-show="selectedUser && !users.find(u => u.sid === selectedUser)?.is_control_enabled"
            class="mt-3 p-3 bg-yellow-50 border border-yellow-200 rounded text-sm text-yellow-700">
            ⚠️ Контроль времени для этого пользователя <b>отключен</b>.
        </div>

    </div>

    {# Блоки настроек #}
    <template x-if="selectedUser && users.find(u => u.sid === selectedUser)?.is_control_enabled">
        <div class="space-y-4">
            {# ===== Блок «Активность» ===== #}
            <div class="bg-white p-3 sm:p-4 md:p-6 rounded-lg shadow border-l-4 border-l-purple-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base sm:text-lg md:text-xl font-bold text-gray-800">
                        📈 Активность за <span x-text="activityDateHeader()"></span>
                    </h2>

                    {# Кнопка-календарь с навигацией по дням #}
                    <div class="relative flex items-center gap-1" x-data="{ open: false }" @click.outside="open = false">
                        
                        {# Кнопка "Назад" #}
                        <button @click="activityPrevDay()" 
                            class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded text-gray-600 transition-colors"
                            title="Предыдущий день">
                            ◀
                        </button>

                        {# Сама кнопка-календарь #}
                        <button @click="open = !open"
                            class="flex items-center gap-2 px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                            <span>📅</span>
                            <span x-text="activityDateLabel()"></span>
                        </button>

                        {# Кнопка "Вперед" #}
                        <button @click="activityNextDay()" 
                            :disabled="activityDate >= getLocalToday()"
                            class="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded text-gray-600 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
                            title="Следующий день">
                            ▶
                        </button>

                        {# Всплывающий календарь #}
                        <div x-show="open" x-transition
                            class="absolute right-0 mt-2 z-20 bg-white border rounded-lg shadow-lg p-3 w-72">

                            {# Навигация по месяцам #}
                            <div class="flex items-center justify-between mb-2">
                                <button @click="activityPrevMonth()"
                                    class="px-2 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded">◀</button>
                                <span class="font-semibold text-sm" x-text="activityMonthLabel()"></span>
                                <button @click="activityNextMonth()"
                                    class="px-2 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded">▶</button>
                            </div>

                            {# Сетка календаря #}
                            <table class="w-full text-xs">
                                <thead>
                                    <tr class="text-gray-500">
                                        <th class="py-1">Пн</th><th class="py-1">Вт</th><th class="py-1">Ср</th>
                                        <th class="py-1">Чт</th><th class="py-1">Пт</th><th class="py-1">Сб</th>
                                        <th class="py-1">Вс</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(row, rowIdx) in activityCalendarRows" :key="rowIdx">
                                        <tr>
                                            <template x-for="(day, dayIdx) in row" :key="dayIdx">
                                                <td class="py-0.5 text-center">
                                                    <template x-if="day">
                                                        <button
                                                            @click="selectActivityDate(day.date); open = false"
                                                            class="w-8 h-8 rounded transition-colors"
                                                            :class="activityDayClass(day)">
                                                            <span x-text="day.day"></span>
                                                        </button>
                                                    </template>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                {# Легенда #}
                <div class="flex flex-wrap gap-3 mb-4 text-xs">
                    <div class="flex items-center gap-1">
                        <div class="w-4 h-4 bg-green-300 rounded"></div>
                        <span>Активность</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-4 h-4 bg-lime-200 rounded"></div>
                        <span>Без интернета</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-4 h-4 bg-gray-300 rounded"></div>
                        <span>Сессия заблокирована (Win+L)</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-4 h-4 bg-red-300 rounded"></div>
                        <span>Заблокирован</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-4 h-4 bg-yellow-300 rounded"></div>
                        <span>Ручной режим</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-4 h-4 bg-gray-200 rounded"></div>
                        <span>Нет данных</span>
                    </div>
                </div>

                {# График активности (288 слотов по 5 минут) #}
                <div class="relative mt-2">
                    {# 🆕 Окно с горизонтальной прокруткой — график масштабируется внутри #}
                    <div class="overflow-x-auto pb-2 custom-scrollbar"
                        style="touch-action: pan-x pan-y;"
                        @touchstart.passive="onChartTouchStart($event)"
                        @touchmove="onChartTouchMove($event)"
                        @touchend="onChartTouchEnd($event)">
                        <div :style="chartWidthStyle()" class="min-w-full">
                    {# Временная шкала сверху (каждый час) #}
                    <div class="flex mb-1">
                        <template x-for="h in 24" :key="h">
                            <div class="flex-1 text-center text-xs text-gray-500 border-l border-gray-300" x-text="h - 1"></div>
                        </template>
                    </div>

                    <div class="flex h-16 sm:h-20 rounded overflow-hidden border border-gray-200">
                        <template x-for="seg in activitySegments" :key="seg.id || (seg.start + '-' + seg.end)">
                            <div class="relative group"
                                :style="`flex-grow: ${seg.end - seg.start}; flex-basis: 0%;`"
                                :class="seg.color"
                                :title="seg.title">
                            </div>
                        </template>
                    </div>

                    {# Временная шкала снизу (каждый час) #}
                    <div class="flex mt-1">
                        <template x-for="h in 24" :key="h">
                            <div class="flex-1 text-center text-xs text-gray-500 border-l border-gray-300" x-text="h - 1"></div>
                        </template>
                    </div>
                        </div>
                    </div>
                </div>

                {# Кнопка-аккордеон #}
                <div class="mt-4 border-t pt-4">
                    <button @click="showEvents = !showEvents" 
                        class="w-full flex items-center justify-between px-4 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-lg text-sm transition-colors">
                        <span class="flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                            </svg>
                            Список событий за день
                        </span>
                        <svg class="w-4 h-4 transition-transform duration-200" 
                             :class="showEvents ? 'rotate-180' : ''" 
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    {# Выпадающий список #}
                    <div x-show="showEvents" x-collapse style="display: none;" class="mt-2">
                        <div class="max-h-44 overflow-y-auto space-y-1 text-xs border rounded-lg p-2 bg-gray-50 custom-scrollbar">
                            <template x-for="entry in [...activityLog].filter(e => e.event_type !== 'heartbeat').reverse()" :key="entry.id">
                                <div class="flex items-start gap-3 p-2 hover:bg-white rounded transition-colors border-b border-gray-100 last:border-0">
                                    <span class="text-gray-500 font-mono shrink-0 w-20" x-text="formatEventTime(entry.created_at)"></span>
                                    <span class="font-medium shrink-0 w-32 truncate" :class="{
                                        'text-red-600': entry.event_type.includes('lock'),
                                        'text-green-600': entry.event_type.includes('unlock'),
                                        'text-blue-600': entry.event_type.includes('manual'),
                                    }" x-text="entry.event_type"></span>
                                    <span class="text-gray-600 break-all" x-text="entry.details"></span>
                                </div>
                            </template>
                            <div x-show="activityLog.length === 0" class="text-gray-400 italic py-6 text-center">
                                Нет событий за этот день
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {# ===== Блок «Сегодня» ===== #}
            <div class="bg-white p-3 sm:p-4 md:p-6 rounded-lg shadow border-l-4 border-l-green-500">
                {# Возврат в режим расписания (если у пользователя активен ручной режим) #}
                <div x-show="selectedUser && today.mode && (today.mode.startsWith('manual') || today.mode === 'not_accepted')"
                    :class="isSchedulePending() ? 'mb-4 p-3 bg-orange-50 border border-orange-200 rounded' : 'mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded'">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-sm" :class="isSchedulePending() ? 'text-orange-700' : 'text-yellow-700'">
                            <template x-if="isSchedulePending()">
                                <span>⏳ <b>Требуется утвердить расписание</b>.</span>
                            </template>
                            <template x-if="!isSchedulePending()">
                                <span>🖐️ У пользователя активен <b>ручной режим</b>
                                    <span x-show="today.manual_until" class="text-yellow-600">(до <span x-text="today.manual_until"></span>)</span>.
                                </span>
                            </template>
                        </span>
                        <button @click="returnToScheduledForUser()"
                            class="shrink-0 px-3 py-1.5 rounded text-xs font-semibold transition-colors"
                            :class="isSchedulePending() ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white'"
                            x-text="isSchedulePending() ? '✅ Активировать расписание' : '🤖 Вернуться в расписание'">
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base sm:text-lg md:text-xl font-bold text-gray-800">
                        📅 Сегодня (переопределение)
                    </h2>
                    <span x-show="savingToday" class="text-xs text-gray-400">⏳ Сохранение…</span>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
                    <div class="bg-blue-50 p-3 rounded">
                        <div class="text-xs text-gray-600">Экранное время</div>
                        <div class="font-bold text-blue-700">
                            <span x-text="formatMinutes(today.screen_time)"></span>
                            <span class="text-blue-400 font-normal"> / </span>
                            <span x-text="formatMinutes((today.limit_min + today.extra_min) * 60)"></span>
                        </div>
                    </div>
                    <div class="bg-green-50 p-3 rounded">
                        <div class="text-xs text-gray-600">Интернет</div>
                        <div class="font-bold text-green-700">
                            <span x-text="formatMinutes(today.internet_time)"></span>
                            <span class="text-green-400 font-normal"> / </span>
                            <span x-text="formatMinutes((today.internet_limit_min + today.internet_extra_min) * 60)"></span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Начало (С:)</label>
                        <input type="time" x-model="today.start_time"
                            @change="saveToday()"
                            class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Конец (До:)</label>
                        <input type="time" x-model="today.end_time"
                            @change="saveToday()"
                            class="w-full p-2 border rounded">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Лимит экрана (мин)</label>
                        <input type="number" x-model.number="today.limit_min" min="0" max="1440"
                            @change="onTodayScreenLimitChanged()"
                            class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Лимит интернета (мин)</label>
                        <input type="number" x-model.number="today.internet_limit_min" min="0"
                            @change="onTodayInternetLimitChanged()"
                            class="w-full p-2 border rounded">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Поправка экрана (мин)</label>
                        <input type="number" x-model.number="today.extra_min" class="w-full p-2 border rounded"
                            @change="onTodayExtraChanged()"
                            placeholder="0">
                        <p class="text-xs text-gray-400 mt-1">Отрицательное — урезать, положительное — добавить</p>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Поправка интернета (мин)</label>
                        <input type="number" x-model.number="today.internet_extra_min"
                            class="w-full p-2 border rounded"
                            @change="onTodayInternetExtraChanged()"
                            placeholder="0">
                    </div>
                </div>
            </div>

            {# ===== Расписание на неделю ===== #}
            <div class="bg-white p-3 sm:p-4 md:p-6 rounded-lg shadow border-l-4 border-l-orange-500">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base sm:text-lg md:text-xl font-bold text-gray-800">
                        📆 Расписание на неделю
                    </h2>
                    <span x-show="savingSchedule" class="text-xs text-gray-400">⏳ Сохранение…</span>
                </div>

                <label class="flex items-center gap-2 mb-4">
                    <input type="checkbox" x-model="sameSchedule" @change="onSameScheduleToggle()" class="w-5 h-5">
                    <span class="text-sm">🔁 Одинаковое расписание для всех дней</span>
                </label>

                <template x-if="sameSchedule">
                    <div class="border-2 border-blue-300 rounded p-3 bg-blue-50">
                        <div class="font-medium text-sm mb-2 text-blue-700">📅 Ежедневно</div>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <label class="text-gray-600">С:</label>
                                <input type="time" x-model="dailySchedule.start_time"
                                    @change="applyDailyToAll(); saveWeekSchedule()"
                                    class="w-full p-1 border rounded">
                            </div>
                            <div>
                                <label class="text-gray-600">До:</label>
                                <input type="time" x-model="dailySchedule.end_time"
                                    @change="applyDailyToAll(); saveWeekSchedule()"
                                    class="w-full p-1 border rounded">
                            </div>
                            <div>
                                <label class="text-gray-600">Экран (мин):</label>
                                <input type="number" x-model.number="dailySchedule.limit_min" min="0" max="1440"
                                    @change="onDailyScreenLimitChanged()"
                                    class="w-full p-1 border rounded">
                            </div>
                            <div>
                                <label class="text-gray-600">Интернет (мин):</label>
                                <input type="number" x-model.number="dailySchedule.internet_limit_min" min="0"
                                    @change="onDailyInternetLimitChanged()"
                                    class="w-full p-1 border rounded">
                            </div>
                        </div>
                    </div>
                </template>

                <div class="space-y-3" x-show="!sameSchedule">
                    <template x-for="(day, idx) in weekDays" :key="idx">
                        <div class="border rounded p-3">
                            <div class="font-medium text-sm mb-2" x-text="day.name"></div>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div>
                                    <label class="text-gray-600">С:</label>
                                    <input type="time" x-model="day.start_time"
                                        @change="saveWeekSchedule()"
                                        class="w-full p-1 border rounded">
                                </div>
                                <div>
                                    <label class="text-gray-600">До:</label>
                                    <input type="time" x-model="day.end_time"
                                        @change="saveWeekSchedule()"
                                        class="w-full p-1 border rounded">
                                </div>
                                <div>
                                    <label class="text-gray-600">Экран (мин):</label>
                                    <input type="number" x-model.number="day.limit_min" min="0" max="1440"
                                        @change="onDayScreenLimitChanged(idx)"
                                        class="w-full p-1 border rounded">
                                </div>
                                <div>
                                    <label class="text-gray-600">Интернет (мин):</label>
                                    <input type="number" x-model.number="day.internet_limit_min" min="0"
                                        @change="onDayInternetLimitChanged(idx)"
                                        class="w-full p-1 border rounded">
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </template>
</div>
{% endmacro %}
